version: '3.8'

# ============================================
# ОБЩИЕ НАСТРОЙКИ ДЛЯ ВСЕХ КОНТЕЙНЕРОВ AIRFLOW
# ============================================
x-airflow-common:
  &airflow-common
  build: .
  environment:
    # Подключение к PostgreSQL (метабаза Airflow)
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    # Базовые настройки Airflow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__FERNET_KEY=Z2tZQm5yU0ZtZ1hJbV90d2hYa2lSbU5hUUpGV0xMYVU=
    - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=UTC
    - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=True
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Настройки логирования
    - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    # Подключение к S3 (MinIO)
    - AWS_ACCESS_KEY_ID=minioadmin
    - AWS_SECRET_ACCESS_KEY=minioadmin
    - AWS_ENDPOINT_URL=http://minio:9000
    - AWS_REGION=us-east-1
    # Python-пути
    - PYTHONPATH=/opt/airflow:/opt/airflow/dags:/opt/airflow/scripts
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - weather_network

# ============================================
# СЕРВИСЫ
# ============================================
services:

  # ---------- PostgreSQL (метабаза Airflow) ----------
  postgres:
    image: postgres:15
    container_name: de_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - weather_network

  # ---------- PostgreSQL (стриминг / витрины) ----------
  postgres_stream:
    image: postgres:15
    container_name: de_postgres_stream
    environment:
      - POSTGRES_USER=${STREAM_DB_USER}
      - POSTGRES_PASSWORD=${STREAM_DB_PASSWORD}
      - POSTGRES_DB=${STREAM_DB_NAME}
    volumes:
      - postgres_stream_data:/var/lib/postgresql/data
      - ./sql/postgres_stream:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STREAM_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - weather_network

  # ---------- Adminer (веб-интерфейс для PostgreSQL) ----------
  adminer:
    image: adminer:latest
    container_name: de_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_stream
    depends_on:
      - postgres
      - postgres_stream
    restart: always
    networks:
      - weather_network

  # ---------- MinIO (S3-совместимое хранилище) ----------
  minio:
    image: quay.io/minio/minio:latest
    container_name: de_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - weather_network

  # ---------- ClickHouse (аналитическая БД) ----------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: de_clickhouse
    environment:
      CLICKHOUSE_DB: weather_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"   # HTTP API
      - "9003:9000"   # Native protocol (для Python)
    restart: always
    networks:
      - weather_network

  # ---------- Apache Kafka (KRaft, без ZooKeeper) ----------
  kafka:
    image: apache/kafka:4.0.0
    container_name: de_kafka
    environment:
      # Настройки KRaft (контроллер + брокер в одном узле)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Листенеры: 9092 для контейнеров, 29092 для доступа с хоста
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Настройки для одного брокера (dev-режим)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Автосоздание топиков (удобно для старта)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"   # Для доступа с твоего ПК
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - weather_network

  # ---------- Kafka Consumer (Kafka → PostgreSQL) ----------
  weather_consumer:
    build: .
    container_name: de_weather_consumer
    command: python /opt/airflow/scripts/kafka_consumer.py
    environment:
      # Подключение к Kafka
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=weather_hourly_raw
      # Подключение к PostgreSQL (стриминг)
      - PG_HOST=postgres_stream
      - PG_PORT=5432
      - PG_USER=${STREAM_DB_USER}
      - PG_PASSWORD=${STREAM_DB_PASSWORD}
      - PG_DATABASE=${STREAM_DB_NAME}
      # Python-пути
      - PYTHONPATH=/opt/airflow:/opt/airflow/scripts
    volumes:
      - ./scripts:/opt/airflow/scripts
    depends_on:
      - kafka
      - postgres_stream
    restart: always
    networks:
      - weather_network

  # ---------- Инициализация Airflow ----------
  airflow-init:
    <<: *airflow-common
    container_name: de_airflow_init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username ${_AIRFLOW_WWW_USER_USERNAME} \
        --password ${_AIRFLOW_WWW_USER_PASSWORD} \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com
      "
    restart: "no"

  # ---------- Веб-сервер Airflow ----------
  airflow-webserver:
    <<: *airflow-common
    container_name: de_airflow_webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
      - minio
      - clickhouse
      - kafka
      - postgres_stream
    restart: always

  # ---------- Шедулер Airflow ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: de_airflow_scheduler
    command: airflow scheduler
    depends_on:
      - airflow-init
      - minio
      - clickhouse
      - kafka
      - postgres_stream
    restart: always

# ============================================
# ТОМА (ПЕРСИСТЕНТНЫЕ ДАННЫЕ)
# ============================================
volumes:
  postgres_data:
  postgres_stream_data:
  minio_data:
  clickhouse_data:
  kafka_data:

# ============================================
# СЕТЬ
# ============================================
networks:
  weather_network:
    driver: bridge